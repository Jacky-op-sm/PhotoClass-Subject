<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>PhotoClass: Subject — This Week</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="assets/css/style.css" />
    <script src="assets/js/firebase-config.js"></script>
    <script src="assets/js/firebase-sdk.js"></script>
    <script defer src="assets/js/storage.js"></script>
    <script defer src="assets/js/progress.js"></script>
    <script defer src="assets/js/sync.js"></script>
    <script defer src="assets/js/app.js"></script>
    <script defer src="assets/js/dashboard.js"></script>
  </head>
  <body data-page="index">
    <a class="skip" href="#app">Skip to content</a>
    <header class="site-header">
      <div class="header-inner">
        <a class="site-brand" href="index.html"
          ><i aria-hidden="true"></i>PhotoClass<span>Subject</span></a
        >
        <nav class="site-nav" aria-label="Study sections">
          <a href="index.html" aria-current="page">This Week</a
          ><a href="onbeing.html">On Being</a
          ><a href="playbook.html">Playbook</a
          ><a href="subjects.html">Subjects</a>
        </nav>
        <span class="sync-indicator" role="status"
          ><i aria-hidden="true"></i><span>Local only</span></span
        >
      </div>
    </header>
    <main id="app" class="page-shell" tabindex="-1">
      <p role="status">Loading this week…</p>
    </main>
    <footer class="site-footer home-footer">
      <span>PhotoClass: Subject</span>
      <details id="sync-settings" class="footer-settings">
        <summary>Sync settings</summary>
        <div class="settings-inner">
          <div>
            <p class="muted" data-sync-status></p>
            <label for="sync-code">Sync code</label>
            <input
              type="password"
              id="sync-code"
              autocomplete="off"
              spellcheck="false"
              placeholder="Enter your private code"
            />
            <div class="actions">
              <button class="btn" id="connect">Save code</button
              ><button class="btn" id="generate">Generate</button
              ><button class="btn" id="disconnect">Clear code</button>
            </div>
            <p class="muted" id="sync-feedback"></p>
          </div>
          <div>
            <h3>Progress backups</h3>
            <p class="muted">
              Includes reading marks, assignments, subjects and private photo
              links.
            </p>
            <div class="actions">
              <button class="btn" id="export">Export progress</button
              ><label class="btn" for="import-file">Import progress</label
              ><input
                class="file-input"
                id="import-file"
                type="file"
                accept=".json,application/json"
              />
            </div>
          </div>
        </div>
      </details>
    </footer>
    <div id="notice" role="status" aria-live="polite"></div>
  </body>
</html>
